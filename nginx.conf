worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # AppCache manifest must be served with the right type or the PS5
    # browser will refuse to use it.
    types {
        text/cache-manifest  appcache;
    }

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens off;

    # The PS5 browser is picky about charset and compression.
    charset utf-8;

    server {
        listen      80 default_server;
        listen [::]:80 default_server;
        server_name _;

        root  /srv/umtx2/document/en/ps5;
        index index.html;

        # AppCache cache-busting rules.
        location = /cache.appcache {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires off;
            etag off;
        }

        # Static site — return a real 404 for missing assets. An SPA-style
        # fallback to /index.html would break the AppCache update protocol
        # (a manifest-listed file silently swapped for HTML poisons the cache).
        location / {
            try_files $uri $uri/ =404;
        }

        # Health check — used by docker healthcheck.
        location = /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}
